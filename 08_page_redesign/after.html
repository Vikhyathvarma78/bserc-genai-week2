<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technova 2026</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.6;
    }
    .hero {
      text-align: center;
      padding: 4rem 1rem;
      width: 100%;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    }
    h1 {
      font-size: 3rem;
      margin: 0;
      background: -webkit-linear-gradient(45deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }
    .subtitle {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }
    .btn-register {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-register:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
    }
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      max-width: 900px;
      padding: 2rem;
      width: 100%;
    }
    .card {
      background: var(--surface);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
      transition: border-color 0.3s;
    }
    .card:hover {
      border-color: var(--accent);
    }
    .card h3 {
      margin-top: 0;
      color: var(--text);
      font-size: 1.4rem;
    }
    .card p {
      color: var(--text-muted);
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>TECHNOVA 2026</h1>
    <p class="subtitle">Three days of robotics, code and music.</p>
    <button class="btn-register">Register now</button>
  </div>

  <div class="events-grid">
    <div class="card">
      <h3>Robotics</h3>
      <p>Battle bots and autonomous rover challenges.</p>
    </div>
    <div class="card">
      <h3>Hackathon</h3>
      <p>36 hours non-stop open problem statements.</p>
    </div>
    <div class="card">
      <h3>Music night</h3>
      <p>Live performances and EDM stage.</p>
    </div>
  </div>

</body>
</html>
