<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scribbly Notes</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f3f4f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .container { display: flex; gap: 20px; max-width: 1200px; width: 100%; flex-wrap: wrap; }
    .editor { flex: 1; min-width: 300px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .preview { flex: 2; min-width: 400px; display: flex; flex-direction: column; align-items: center; }
    textarea { width: 100%; height: 300px; padding: 10px; border: 1px solid #d1d5db; border-radius: 4px; resize: vertical; font-family: monospace; }
    canvas { background: white; box-shadow: 0 10px 15px rgba(0,0,0,0.1); border-radius: 4px; margin-bottom: 20px; }
    .controls { display: flex; gap: 10px; margin-top: 15px; margin-bottom: 15px; }
    button { padding: 10px 15px; border: none; border-radius: 4px; background: #3b82f6; color: white; cursor: pointer; font-weight: 600; }
    button:hover { background: #2563eb; }
    h1 { color: #1f2937; text-align: center; }
  </style>
</head>
<body>
  <h1>Scribbly Notes</h1>
  <div class="container">
    <div class="editor">
      <h3>Your Text</h3>
      <textarea id="textInput">Engineering Physics Notes:

1. Thermodynamics deals with heat and temperature.
2. The First Law is basically energy conservation.
3. Entropy always increases in an isolated system.

Make sure to revise Carnot Engine efficiency before the mid-term!</textarea>
      <div class="controls">
        <label>Ink: <input type="color" id="inkColor" value="#000080"></label>
        <button id="renderBtn">Render Handwriting</button>
      </div>
    </div>
    <div class="preview">
      <canvas id="paper" width="600" height="800"></canvas>
      <button id="saveBtn">Download Note</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('paper');
    const ctx = canvas.getContext('2d');

    function drawPaper() {
      // Background
      ctx.fillStyle = '#fdfbf7';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Margins
      ctx.strokeStyle = '#ef4444'; // Red margin
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(80, 0); ctx.lineTo(80, canvas.height);
      ctx.stroke();

      // Lines
      ctx.strokeStyle = '#93c5fd'; // Blue lines
      for (let y = 100; y < canvas.height; y += 30) {
        ctx.beginPath();
        ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function renderText() {
      drawPaper();
      const text = document.getElementById('textInput').value;
      const ink = document.getElementById('inkColor').value;
      const lines = text.split('\n');
      
      let startY = 100; // First line Y
      ctx.fillStyle = ink;
      // Using generic cursive fallback for offline reliability
      ctx.font = '20px "Brush Script MT", "Comic Sans MS", cursive'; 
      ctx.textBaseline = 'bottom';

      lines.forEach(line => {
        let currentX = 90;
        const words = line.split(' ');
        
        words.forEach(word => {
          // Add natural human jitter
          const yOffset = (Math.random() - 0.5) * 4;
          const rotation = (Math.random() - 0.5) * 0.05;
          
          ctx.save();
          ctx.translate(currentX, startY + yOffset - 5);
          ctx.rotate(rotation);
          ctx.fillText(word, 0, 0);
          ctx.restore();

          currentX += ctx.measureText(word).width + 8 + (Math.random() * 2);
        });
        startY += 30; // Move to next line
      });
    }

    document.getElementById('renderBtn').addEventListener('click', renderText);
    document.getElementById('saveBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'my_scribbles.png';
      link.href = canvas.toDataURL();
      link.click();
    });

    // Initial render
    window.onload = renderText;
  </script>
</body>
</html>
